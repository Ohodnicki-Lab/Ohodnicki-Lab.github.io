# Refreshes assets/data/publications.json from OpenAlex.
#
# Runs on the first of each month, and whenever you press "Run workflow" on the
# Actions tab. Nothing else needs doing: if the list has changed, the file is
# committed and the website picks it up on the next page load.
#
# One-time setup:
#   1. Get a free key at https://openalex.org/settings/api
#   2. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: OPENALEX_API_KEY     Value: the key
#   3. Optionally add a second secret OPENALEX_MAILTO with a contact address
name: Update publications

on:
  schedule:
    - cron: '0 6 1 * *'      # 06:00 UTC on the 1st
  workflow_dispatch:          # and on demand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python tools/fetch_publications.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first. A brand-new file is untracked, and `git diff` ignores
          # untracked files, so checking the diff before staging reports "no
          # change" on the very first run and the data never gets committed.
          git add assets/data/publications.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Update publications from OpenAlex"
          git push