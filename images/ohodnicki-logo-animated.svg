<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300"><style>
 .incoming .wpk{fill:none;stroke:#FFB81C;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
 .incoming{opacity:0;animation:arrive 1.5s ease-out forwards;}
 .rstroke{fill:none;stroke:#003594;stroke-width:7;stroke-linecap:round;
   stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.0s ease-out forwards .35s;}
 .hex path{fill:none;stroke:#003594;stroke-width:2.5;stroke-linejoin:round;}
 .hex{opacity:0;animation:fade .9s ease forwards .8s;}
 .beam{fill:none;stroke:#FFB81C;stroke-linecap:round;stroke-linejoin:round;
   stroke-dasharray:100;stroke-dashoffset:100;}
 .beam.thin{stroke-width:4;} .beam.thick{stroke-width:6;} .beam.sine{stroke-width:4;}
 .beam.mid{animation:draw 1.15s ease-out forwards 1.2s;}
 .beam.top{animation:draw 1.1s ease-out forwards 1.3s;}
 .beam.bot{animation:draw 1.1s ease-out forwards 1.35s;}
 .beam.sine{animation:draw 1.3s ease-out forwards 1.25s;}
 .nedge{fill:none;stroke:#FFB81C;stroke-width:1.3;stroke-linecap:round;
   stroke-dasharray:100;stroke-dashoffset:100;opacity:0;}
 .e1{animation:drawedge .55s ease forwards 3.0s;}
 .e2{animation:drawedge .55s ease forwards 3.12s;}
 .e3{animation:drawedge .55s ease forwards 3.24s;}
 .e4{animation:drawedge .55s ease forwards 3.36s;}
 .node{fill:#FFB81C;opacity:0;transform-box:fill-box;transform-origin:center;}
 .n3{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards 2.5s, fire 2.4s ease-in-out infinite 3.8s;}
 .n1{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards 2.62s, fire 2.4s ease-in-out infinite 3.9s;}
 .n2{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards 2.72s, fire 2.4s ease-in-out infinite 4.0s;}
 .n4{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards 2.85s, fire 2.4s ease-in-out infinite 4.15s;}
 .halo{fill:#FFB81C;opacity:0;transform-box:fill-box;transform-origin:center;}
 .n1h{animation:halo 2.4s ease-out infinite 3.9s;}
 .n2h{animation:halo 2.4s ease-out infinite 4.0s;}
 .n3h{animation:halo 2.4s ease-out infinite 3.8s;}
 .n4h{animation:halo 2.4s ease-out infinite 4.15s;}
 @keyframes arrive{0%{transform:translateX(-125px);opacity:0;}18%{opacity:1;}
   78%{transform:translateX(0);opacity:1;}100%{transform:translateX(0);opacity:0;}}
 @keyframes draw{to{stroke-dashoffset:0;}}
 @keyframes fade{from{opacity:0;}to{opacity:1;}}
 @keyframes drawedge{0%{opacity:0;stroke-dashoffset:100;}25%{opacity:.75;}
   100%{opacity:.75;stroke-dashoffset:0;}}
 @keyframes pop{0%{opacity:0;transform:scale(0);}70%{opacity:1;transform:scale(1.3);}
   100%{opacity:1;transform:scale(1);}}
 @keyframes fire{0%,100%{opacity:1;}50%{opacity:.45;}}
 @keyframes halo{0%{opacity:.45;transform:scale(.5);}100%{opacity:0;transform:scale(3.2);}}
</style><defs>
